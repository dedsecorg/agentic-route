version: 2.1

jobs:
  lint:
    docker:
      - image: alpine:3.20
    steps:
      - checkout
      - run:
          name: Install shellcheck and bash
          command: apk add --no-cache shellcheck bash
      - run:
          name: Lint shell scripts
          command: |
            find . -name "*.sh" -type f | xargs shellcheck -x
            find bin -type f | xargs shellcheck -x
      - run:
          name: Validate install.sh
          command: shellcheck -x install.sh

  test:
    docker:
      - image: alpine:3.20
    steps:
      - checkout
      - run:
          name: Install test dependencies
          command: apk add --no-cache bash coreutils iproute2 jq inotify-tools grep
      - run:
          name: Run unit tests
          command: |
            ./bin/agentic-route-reconcile --help
            ./bin/agentic-route status
      - run:
          name: Test daemon syntax
          command: bash -n ./bin/agentic-route-daemon

  build:
    docker:
      - image: docker:27-cli
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build container image
          command: |
            docker build -t agentic-route:test .

workflows:
  ci:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - build:
          requires:
            - test